<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a2b"/>
      <stop offset="50%" stop-color="#091424"/>
      <stop offset="100%" stop-color="#020712"/>
    </linearGradient>
    <linearGradient id="gold_pass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg_pass)"/>
  <circle cx="300" cy="200" r="180" fill="#eab308" opacity="0.08" filter="blur(60px)"/>
  
  <rect x="170" y="45" width="260" height="310" rx="16" fill="#081b2e" stroke="url(#gold_pass)" stroke-width="2.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.7))"/>
  
  <!-- Emblem Circle -->
  <circle cx="300" cy="140" r="45" fill="none" stroke="url(#gold_pass)" stroke-width="2"/>
  <circle cx="300" cy="140" r="38" fill="none" stroke="url(#gold_pass)" stroke-width="1" stroke-dasharray="4 2"/>
  
  <text x="300" y="90" text-anchor="middle" fill="url(#gold_pass)" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="2">PASSPORT</text>
  <text x="300" y="105" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">BANGLADESH</text>
  
  <!-- Globe In Emblem -->
  <circle cx="300" cy="140" r="22" fill="url(#gold_pass)" opacity="0.3"/>
  <text x="300" y="146" text-anchor="middle" fill="url(#gold_pass)" font-size="20">🌐</text>
  
  <text x="300" y="225" text-anchor="middle" fill="url(#gold_pass)" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="1">E-PASSPORT</text>
  <text x="300" y="245" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">APPLICATION &amp; RENEWAL</text>

  <!-- Biometric Chip Symbol -->
  <rect x="275" y="275" width="50" height="32" rx="6" fill="none" stroke="url(#gold_pass)" stroke-width="2"/>
  <circle cx="300" cy="291" r="7" fill="none" stroke="url(#gold_pass)" stroke-width="2"/>
  <line x1="275" y1="291" x2="293" y2="291" stroke="url(#gold_pass)" stroke-width="2"/>
  <line x1="307" y1="291" x2="325" y2="291" stroke="url(#gold_pass)" stroke-width="2"/>
</svg>