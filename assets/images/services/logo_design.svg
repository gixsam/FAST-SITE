  <text x="300" y="110" text-anchor="middle" fill="url(#pinkGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">PREMIUM LOGO &amp; BRAND DESIGN</text>
  <text x="300" y="140" text-anchor="middle" fill="#fbcfe8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">প্রিমিয়াম লোগো ও ব্র্যান্ডিং সার্ভিস</text>
  <circle cx="300" cy="205" r="35" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="2"/>
  <text x="300" y="217" text-anchor="middle" fill="#f43f5e" font-size="30">🎨</text>
  <text x="300" y="275" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">VECTOR • 3D MOCKUP • BRANDING</text>
