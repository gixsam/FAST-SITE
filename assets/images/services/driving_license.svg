  <rect width="600" height="400" fill="url(#bg_dl)"/>
  <circle cx="480" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="blur(45px)"/>
  
  <rect x="75" y="60" width="450" height="280" rx="20" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  
